name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        name: E2E Tests (Chromium & API)
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: 'npm' # Caches npm dependencies to speed up workflow execution

            - name: Install dependencies
              run: npm ci

            # --- ДОБАВЛЕННЫЕ ШАГИ НАЧИНАЮТСЯ ЗДЕСЬ ---

            - name: Check formatting with Prettier
              run: npx prettier --check .

            - name: Run ESLint
              run: npx eslint .

            # --- ДОБАВЛЕННЫЕ ШАГИ ЗАКАНЧИВАЮТСЯ ЗДЕСЬ ---

            - name: Install Playwright Chromium Browser
              run: npx playwright install chromium --with-deps

            - name: Run Playwright tests
              run: npx playwright test --grep-invert "@flaky"
              env:
                  CI: true
                  CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
                  CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
                  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

            - name: Upload Playwright Report
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
