name: Lint Code Base

# Trigger the workflow on push or pull request events for the master branch
on:
    push:
        branches: ['master']
    pull_request:
        branches: ['master']

jobs:
    lint:
        runs-on: ubuntu-latest # Use the latest Ubuntu Linux environment

        steps:
            # 1. Check out the repository code
            - name: Checkout repository
              uses: actions/checkout@v4

            # 2. Set up Node.js environment
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24' # Use the active Node.js LTS version

            # 3. Install project dependencies (Playwright, ESLint, etc.)
            - name: Install dependencies
              run: npm ci

            # 4. Execute the linter to check code quality
            - name: Run Linter & Type Check
              run: |
                npm run lint
                npm run type-check
