name: Code Quality & Linting

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['master']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter & Type Check
        run: |
          npm run lint
          npm run type-check